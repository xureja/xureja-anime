<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Anime - Xureja Anime</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/anime.css"> <!-- Conectamos el nuevo CSS -->
</head>
<body>

    <!-- CABECERA Navegación principal -->
    <header class="main-header">
        <div class="logo">
            <a href="index.html" style="text-decoration: none;">
                <h1 style="color: white; font-size: 1.8rem; margin: 0;">Xureja <span style="color: #ff6b00;">Anime</span></h1>
            </a>
        </div>
        
        <nav class="nav-menu">
            <a href="index.html">Inicio</a>
            <a href="directorio.html">Directorio</a>
            <a href="mi_lista.html">Mi Lista</a>
            
            <!-- ENLACE ADMIN (JS LO MUESTRA) -->
            <a href="admin.html" id="nav-admin" class="nav-admin-link">Panel Admin 👑</a>
        </nav>
        
        <div class="header-actions">
            <div class="search-bar">
                <input type="text" placeholder="Buscar anime...">
            </div>
            
            <!-- ZONA DE AUTENTICACIÓN -->
        <div class="header-auth">
            <!-- Botón normal (Aparece si NO hay sesión) -->
            <a href="login.html" id="btn-login-header" class="btn-login">Iniciar Sesión</a>
            
            <!-- Perfil Desplegable (Aparece si SÍ hay sesión) -->
            <div id="user-profile-menu" class="user-menu-container">
                <img src="" alt="Avatar" class="user-avatar" id="user-avatar-img">
                <span class="user-greeting">Hola, <span id="nav-username" style="color: #ff6b00;">Usuario</span></span>
                
                <div class="user-dropdown">
                    <a href="perfil.html">Mi Perfil</a>
                    <a href="mi_lista.html">Mi Colección</a>
                    <a href="#" id="btn-logout-dropdown" class="logout-btn">Cerrar Sesión</a>
                </div>
            </div>
        </div>
        </div>
    </header>

    <main class="anime-details-container">
        <!-- Mensaje mientras Python responde -->
        <div id="loading-message" style="text-align: center; color: white; padding: 50px; font-size: 1.2rem;">
            Cargando información...
        </div>
        
        <!-- Este bloque se ocultará hasta que tengamos los datos -->
        <div id="anime-content" style="display: none;">
            
            <div class="anime-header-info">
                <img id="anime-cover" src="" alt="Portada del Anime">
                <div class="anime-text-info">
                    <h2 id="anime-title">Cargando Título...</h2>
                    <p id="anime-genre" class="genre-tag">Cargando Género...</p>
                    <p id="anime-synopsis" class="synopsis">Cargando sinopsis...</p>
                    <button id="btn-fav" class="btn-favorite">
                        🤍 Añadir a Mi Lista
                    </button
                </div>
            </div>

            <div class="episodes-section">
                <h3>Lista de Episodios</h3>
                <div id="episodes-grid" class="episodes-grid">
                    <!-- Aquí JS dibujará los botones de los episodios -->
                </div>
            </div>
            
        </div>
    </main>

    <!-- Conectamos tu archivo JS maestro -->
    <script src="js/main.js"></script>
</body>
</html>
