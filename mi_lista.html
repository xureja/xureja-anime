<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista - Xureja Anime</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- CABECERA -->
    <header class="main-header">
        <div class="logo">
            <a href="index.html" class="logo-link">
                <h1 class="logo-title">Xureja <span>Anime</span></h1>
            </a>
        </div>
        
        <nav class="nav-menu">
            <a href="index.html">Inicio</a>
            <a href="directorio.html">Directorio</a>
            <a href="mi_lista.html" class="active-link">Mi Lista</a>
            <a href="admin.html" id="nav-admin" class="nav-admin-link">Panel Admin 👑</a>
        </nav>
        
        <div class="header-actions">
            <div class="search-bar">
                <input type="text" placeholder="Buscar anime...">
            </div>
            
            <!-- ZONA DE AUTENTICACIÓN -->
        <div class="header-auth">
            <!-- Botón normal (Aparece si NO hay sesión) -->
            <a href="login.html" id="btn-login-header" class="btn-login">Iniciar Sesión</a>
            
            <!-- Perfil Desplegable (Aparece si SÍ hay sesión) -->
            <div id="user-profile-menu" class="user-menu-container">
                <img src="" alt="Avatar" class="user-avatar" id="user-avatar-img">
                <span class="user-greeting">Hola, <span id="nav-username" style="color: #ff6b00;">Usuario</span></span>
                
                <div class="user-dropdown">
                    <a href="perfil.html">Mi Perfil</a>
                    <a href="mi_lista.html">Mi Colección</a>
                    <a href="#" id="btn-logout-dropdown" class="logout-btn">Cerrar Sesión</a>
                </div>
            </div>
        </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="my-list-main">
        <h2 class="my-list-title">Mi Colección</h2>
        
        <div id="mensaje-lista" class="my-list-message">
            Cargando tu lista...
        </div>

        <div class="grid-animes" id="contenedor-mi-lista">
            <!-- JavaScript inyectará las tarjetas aquí -->
        </div>
    </main>

    <script src="js/main.js"></script>
    
    <!-- Lógica exclusiva para Mi Lista -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usuarioActual = localStorage.getItem('usuarioXureja');
            const contenedor = document.getElementById('contenedor-mi-lista');
            const mensaje = document.getElementById('mensaje-lista');

            if (!usuarioActual) {
                mensaje.innerHTML = 'Debes <a href="login.html">iniciar sesión</a> para ver tu lista de animes guardados.';
                return;
            }

            fetch(`https://xureja-backend.onrender.com/api/favoritos/lista/${usuarioActual}`)
                .then(res => res.json())
                .then(animes => {
                    if (animes.length === 0) {
                        mensaje.innerHTML = 'Aún no has guardado ningún anime. ¡Explora el <a href="index.html">Inicio</a> y añade tus favoritos!';
                    } else {
                        // Ocultamos el mensaje usando una clase de CSS genérica o manipulando la propiedad
                        mensaje.style.display = 'none'; 
                        
                        animes.forEach(anime => {
                            const urlDetalles = `anime.html?name=${encodeURIComponent(anime.titulo)}`;
                            contenedor.innerHTML += `
                                <a href="${urlDetalles}" class="anime-card-link">
                                    <article class="anime-card">
                                        <div class="img-container">
                                            <img src="${anime.portada}" alt="${anime.titulo}">
                                            <div class="anime-overlay"><span>Ver Detalles</span></div>
                                        </div>
                                        <h3>${anime.titulo}</h3>
                                    </article>
                                </a>
                            `;
                        });
                    }
                })
                .catch(err => {
                    console.error(err);
                    mensaje.innerHTML = '<span class="error-text">Error al conectar con el servidor.</span>';
                });
        });
    </script>
</body>
</html>
