<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Xureja Anime</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css"> <!-- Nuestro nuevo CSS -->
</head>
<body>

    <header class="header">
        <div class="logo">
            <!-- Al hacer clic en el logo, regresamos al inicio -->
            <a href="index.html" style="text-decoration: none;">
                <h1>Xureja <span style="color: #ff6b00;">Anime</span></h1>
            </a>
        </div>
    </header>

    <div class="auth-wrapper">
        <main class="auth-container">
            <h2>Bienvenido</h2>
            <p>Inicia sesión para continuar tu aventura</p>

            <form class="auth-form" id="login-form">
                
                <!-- CAMBIADO: Ahora pide Usuario -->
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" required placeholder="ej: xureja">

                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">

                <button type="submit" class="btn-auth">Entrar</button>
                
                <div id="login-alert" class="auth-alert"></div>
            </form>

            <div class="auth-links">
                ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página recargue
            
            // CAMBIADO: Capturamos 'username' en vez de 'email'
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('login-alert');
            const btnSubmit = document.querySelector('.btn-auth');
            
            alertBox.style.display = 'block';
            alertBox.style.color = '#ff9800'; // Naranja
            alertBox.textContent = "Verificando credenciales...";
            btnSubmit.disabled = true;

            const formData = new FormData();
            
            // CAMBIADO: Enviamos el 'username' a Python
            formData.append('username', username);
            formData.append('password', password);

            fetch('https://xureja-backend.onrender.com/api/auth/login', {
                method: 'POST',
                body: formData
            })
            .then(async res => {
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Error al iniciar sesión");
                return data;
            })
            .then(data => {
                // ¡Login Exitoso!
                alertBox.style.color = '#4CAF50'; // Verde
                alertBox.textContent = data.mensaje;
                
                // Guardamos en el navegador que el usuario ya entró
                localStorage.setItem('usuarioXureja', data.username);

                // Lo enviamos a la página principal después de 1 segundo
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            })
            .catch(error => {
                // Error (Usuario no existe o contraseña mala)
                alertBox.style.color = '#F44336'; // Rojo
                alertBox.textContent = error.message;
                btnSubmit.disabled = false;
            });
        });
    </script>
</body>
</html>
