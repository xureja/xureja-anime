<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Xureja Anime</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <a href="index.html" style="text-decoration: none;">
                <h1>Xureja <span style="color: #ff6b00;">Anime</span></h1>
            </a>
        </div>
    </header>

    <div class="auth-wrapper">
        <main class="auth-container">
            <h2>Crear Cuenta</h2>
            <p>Únete a la comunidad de Xureja</p>

            <form class="auth-form" id="register-form">
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" required placeholder="Ej: Kirito99">

                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@correo.com">

                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">

                <label for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" required placeholder="••••••••">

                <button type="submit" class="btn-auth">Registrarse</button>
                
                <div id="register-alert" class="auth-alert"></div>
            </form>

            <div class="auth-links">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Evitamos que la página recargue
            
            // Obtenemos los valores de los inputs
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            const alertBox = document.getElementById('register-alert');
            const btnSubmit = document.querySelector('.btn-auth');
            
            alertBox.style.display = 'block';

            // Validación de contraseñas iguales
            if (password !== confirmPassword) {
                alertBox.style.color = '#F44336'; // Rojo
                alertBox.textContent = "Las contraseñas no coinciden.";
                return;
            }

            // Estado de carga
            alertBox.style.color = '#ff9800'; // Naranja
            alertBox.textContent = "Creando tu cuenta en Xureja Anime...";
            btnSubmit.disabled = true;

            // Preparamos los datos para enviarlos a Python
            const formData = new FormData();
            formData.append('username', username);
            formData.append('email', email);
            formData.append('password', password);

            // Enviamos la petición al Backend
            fetch('https://xureja-backend.onrender.com/api/auth/registro', {
                method: 'POST',
                body: formData
            })
            .then(async res => {
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Error en el registro");
                return data;
            })
            .then(data => {
                // ¡Éxito!
                alertBox.style.color = '#4CAF50'; // Verde
                alertBox.textContent = data.mensaje;
                document.getElementById('register-form').reset();
                
                // Magia: Lo enviamos al login después de 2 segundos
                window.location.href = 'login.html';
            })
            .catch(error => {
                // Si el correo o el usuario ya existen, Python nos manda un error aquí
                alertBox.style.color = '#F44336'; // Rojo
                alertBox.textContent = error.message;
                btnSubmit.disabled = false;
            });
        });
    </script>
</body>
</html>
